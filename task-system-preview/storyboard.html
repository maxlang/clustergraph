<html lang="en">
<head>

<title>Task System — Revised Interaction Storyboard v2</title>
<style>

*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,select,textarea,input{font:inherit} button{cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;height:60px;border-bottom:1px solid var(--line);background:rgba(249,249,247,.96);backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:0 14px}
.brand{font-weight:720;letter-spacing:-.02em;margin-right:auto}.brand small{display:block;font-weight:500;color:var(--muted);font-size:10px;letter-spacing:.03em;margin-top:1px}
.topbar button,.topbar select{border:1px solid #c9cac6;background:#fff;border-radius:7px;padding:7px 10px;color:#333}.topbar button.active{background:#222;color:#fff;border-color:#222}.topbar .nav{min-width:36px}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr) 330px;gap:14px;padding:14px;align-items:start}
.frameNav,.reviewPanel{background:#fafaf8;border:1px solid #cfd0cb;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.025)}

.frameNav button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:8px 9px;border-radius:7px;font-size:12px;line-height:1.25;color:#4e5054}.frameNav button.active{background:#e9ebee;color:#111;font-weight:650}.frameNav .group{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.12em;margin:16px 9px 5px}
.stageWrap{min-width:0}.stageMeta{max-width:1120px;margin:0 auto 8px;display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.stage{max-width:1120px;margin:0 auto;background:var(--paper);border:1px solid #c9cac5;border-radius:11px;min-height:730px;box-shadow:var(--shadow);overflow:hidden;transition:max-width .2s ease}.stage.mobile{max-width:390px;min-height:780px}

/* app chrome */
.mockApp{display:grid;grid-template-columns:176px minmax(0,1fr);min-height:730px;background:#fff}.mobile .mockApp{display:block;min-height:780px}.side{border-right:1px solid #e0e0dc;background:#fbfbfa;padding:15px 11px;color:#56585c;font-size:12px}.mobile .side{display:none}.traffic{display:flex;gap:5px;margin:0 0 19px 2px}.traffic i{width:8px;height:8px;border-radius:50%;background:#d8d8d5}.sideItem{padding:7px 8px;border-radius:6px;margin:2px 0}.sideItem.active{background:#ededeb;color:#222}.sideSep{font-size:9px;text-transform:uppercase;letter-spacing:.11em;color:#aaa;margin:18px 8px 5px}.main{min-width:0;position:relative}.appTop{height:44px;border-bottom:1px solid #ecece9;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#8a8b8f;font-size:11px}.mobile .appTop{height:42px}.appTop .tools{display:flex;gap:15px;align-items:center}.appTop button{border:0;background:transparent;color:#777;padding:0}.note{max-width:820px;margin:0 auto;padding:34px 58px 80px;font-family:Georgia,"Times New Roman",serif;font-size:14px;line-height:1.52}.mobile .note{padding:25px 19px 100px;font-size:14px}.note h1{font-size:27px;font-weight:600;letter-spacing:-.02em;margin:0 0 22px}.mobile .note h1{font-size:23px}.note h2{font-family:Inter,sans-serif;font-size:15px;letter-spacing:-.01em;margin:24px 0 9px}.note p{margin:9px 0 13px}.muted{color:var(--muted)}
.line{position:relative;padding:2px 6px 2px 22px;min-height:25px;border-radius:4px;margin:1px 0}.line .box{position:absolute;left:1px;top:5px;width:13px;height:13px;border:1.3px solid #62646a;border-radius:2px;background:#fff;font-family:Inter,sans-serif;font-size:9px;line-height:11px;text-align:center}.line.done{color:#8b8c90;text-decoration:line-through}.line.done .box{background:#4777bd;border-color:#4777bd;color:white}.line.done .box::after{content:'✓';text-decoration:none}.line .trail{color:#85878d;font-family:Inter,sans-serif;font-size:11px;margin-left:5px;white-space:nowrap}.line .tag{color:#777;font-family:Inter,sans-serif;font-size:11px;font-style:italic;margin-left:6px}.line.urgent::before{content:'';position:absolute;left:-14px;top:9px;width:5px;height:5px;border-radius:50%;background:#ef7272}.line.conflicted{background:var(--red-soft);box-shadow:inset 3px 0 var(--red)}.line.agent{background:#f6f3ff;box-shadow:inset 3px 0 #7a65b7}.line.selected{background:var(--select);outline:1px solid #a9bfdf}.line.reviewHigh{box-shadow:inset 3px 0 #d35d5d;background:#fff7f7}.line.reviewMed{box-shadow:inset 3px 0 #d2a144}.line.reviewLow{box-shadow:inset 3px 0 #b7bdc6}.line .metaInline{font-family:Inter,sans-serif;font-size:10px;color:#777;float:right;margin-left:8px}.nested{margin:4px 0 7px 25px;padding-left:14px}.nested div{margin:3px 0}.collapsed{font-family:Inter,sans-serif;color:#555}.collapsed span{font-size:10px;color:#8b8d92;margin-left:6px}.proseBox{border-left:2px solid #ddd;padding-left:12px;color:#54565a;margin:11px 0}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#f5f5f3;border:1px solid #e2e2df;border-radius:6px;padding:9px;font-size:11px;margin:10px 0}.footerCount{border-top:1px solid #eee;color:#999;font-family:Inter,sans-serif;font-size:10px;padding-top:9px;margin-top:16px}

.accessory{position:absolute;left:0;right:0;bottom:0;border-top:1px solid #ddd;background:rgba(250,250,249,.98);padding:8px 10px 12px;display:flex;gap:7px;z-index:5}.accessory button{flex:1;border:0;background:#eeeeec;border-radius:7px;padding:9px 4px;color:#43454a}.accessory button.active{background:#dfe8f6;color:#23528d}
.bulkBar{font-family:Inter,sans-serif;position:sticky;bottom:18px;margin:18px auto 0;max-width:700px;border:1px solid #b8bec8;background:#fff;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.13);padding:9px 10px;display:flex;align-items:center;gap:7px;z-index:4}.bulkBar strong{font-size:11px;margin-right:auto}.bulkBar button{border:1px solid #c6c8cc;background:#fff;border-radius:6px;padding:6px 8px;font-size:10px}.bulkBar button.primary{background:#222;color:#fff;border-color:#222}

.taskLens{font-family:Inter,sans-serif;padding:22px 30px 80px;max-width:900px;margin:0 auto}.mobile .taskLens{padding:18px 14px 90px}.lensHeader{display:flex;align-items:center;gap:8px;margin-bottom:12px}.lensHeader h1{font-size:19px;margin:0 auto 0 0}.lensHeader button,.lensHeader select{border:1px solid #ccc;background:#fff;border-radius:6px;padding:6px 8px;font-size:10px}.taskOnly{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;border-bottom:1px solid #ececea;padding:8px 4px;font-size:12px}.taskOnly:hover{background:#fafafa}.taskOnly .check{width:14px;height:14px;border:1px solid #666;border-radius:2px}.taskOnly .path{font-size:9px;color:#999;margin-top:2px}.taskOnly .meta{display:flex;gap:5px;color:#777;font-size:9px}.taskOnly .meta span{border:1px solid #ddd;border-radius:4px;padding:2px 4px;background:#fff}.taskOnly.selected{background:var(--select)}
.compare{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;font-family:Inter,sans-serif}.mobile .compare{grid-template-columns:1fr}.compareCard{border:1px solid #c8c9c5;border-radius:9px;background:#fafafa;padding:12px}.compareCard.leading{border-color:#7fa4d5;background:#f5f8fd}.compareCard h3{font-size:12px;margin:0 0 4px}.compareCard .badge{font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:#888}.compareCard .example{font-family:Georgia,serif;border:1px solid #ddd;background:#fff;border-radius:6px;padding:11px;margin-top:10px;font-size:12px;min-height:120px}.compareCard .result{font-size:10px;color:#666;margin-top:8px}.toast{font-family:Inter,sans-serif;display:flex;justify-content:space-between;align-items:center;border:1px solid #b9c8bd;background:var(--green-soft);border-radius:7px;padding:7px 9px;font-size:10px;margin:10px 0}.toast.warn{background:var(--amber-soft);border-color:#d7bf8b}.toast button{border:0;background:transparent;color:#235e40;font-weight:650}
/* sidebar/task */
.split{display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:685px}.mobile .split{display:block}.split .note{padding-right:36px}.taskSide{border-left:1px solid #ddd;background:#fbfbfa;padding:18px 18px 60px;font-family:Inter,sans-serif}.mobile .taskSide{border-left:0;border-top:1px solid #ddd}.taskSide h1{font-size:18px;margin:0 0 4px}.taskId{font-size:9px;color:#aaa}.tabs{display:flex;gap:12px;border-bottom:1px solid #ddd;margin:17px 0 15px}.tabs button{border:0;background:transparent;padding:8px 0;font-size:10px;color:#777}.tabs button.active{color:#222;border-bottom:2px solid #222}.summaryGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.summaryCell{border:1px solid #e0e0dc;border-radius:7px;background:#fff;padding:9px}.summaryCell label{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:#999}.summaryCell strong{font-size:11px}.sideSection{margin-top:16px}.sideSection h3{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#888;margin:0 0 7px}.stepRow{border:1px solid #dededb;border-radius:7px;padding:8px;margin:6px 0;background:#fff;font-size:11px}.stepRow.current{border-color:#9eb8dc;background:#f2f6fc}.stepRow.done{color:#888}.stepRow small{display:block;color:#999;margin-top:3px}.activityGroup{margin:14px 0}.activityGroup h3{font-size:10px;margin:0 0 8px;color:#666}.activityItem{position:relative;padding:0 0 13px 28px;font-size:11px}.activityItem .icon{position:absolute;left:0;top:0;width:19px;height:19px;border-radius:50%;border:1px solid #ccc;background:#fff;display:grid;place-items:center;font-size:9px}.activityItem strong{display:block}.activityItem .source{color:#999;font-size:9px;margin-top:2px}.storyToggle{display:flex;border:1px solid #ccc;border-radius:6px;overflow:hidden;width:max-content}.storyToggle button{border:0;background:#fff;padding:5px 8px;font-size:9px}.storyToggle button.active{background:#222;color:#fff}
/* compact decision panels */
.compactCard{font-family:Inter,sans-serif;border:1px solid #d1d1cc;background:#fff;border-radius:9px;padding:14px;max-width:560px;margin:18px auto}.compactCard h2{font-size:14px;margin:0 0 3px}.compactCard .sub{font-size:10px;color:#888}.choiceRow{display:flex;gap:8px;margin-top:12px}.choiceRow button{border:1px solid #c5c6c2;background:#fff;border-radius:7px;padding:8px 10px;font-size:10px}.choiceRow button.primary{background:#222;color:#fff}.aiHint{border-top:1px solid #e2e2de;margin-top:12px;padding-top:10px;font-size:10px;color:#555}.aiHint strong{color:#6d5a9c}.draft{font-family:Inter,sans-serif;border:1px solid #d4d4cf;border-radius:9px;background:#fff;padding:15px;max-width:620px;margin:18px auto}.draft textarea{width:100%;min-height:160px;border:1px solid #ddd;border-radius:7px;padding:11px;font-size:11px;line-height:1.5;resize:none}.draftActions{display:flex;gap:8px;justify-content:flex-end;margin-top:9px}.draftActions button{border:1px solid #c6c7c3;background:#fff;border-radius:6px;padding:7px 9px;font-size:10px}.draftActions button.primary{background:#346cc0;color:#fff;border-color:#346cc0}.agentGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-family:Inter,sans-serif}.mobile .agentGrid{grid-template-columns:1fr}.agentPanel{border:1px solid #d6d6d2;border-radius:9px;padding:13px;background:#fff}.agentPanel h3{font-size:11px;margin:0 0 8px}.progress{height:7px;background:#eee;border-radius:10px;overflow:hidden}.progress i{display:block;width:72%;height:100%;background:#6e82aa}.chatLine{font-size:10px;border-left:2px solid #ddd;padding:5px 8px;margin:6px 0}.resource{display:grid;grid-template-columns:1fr auto;gap:5px;font-size:10px;padding:6px 0;border-bottom:1px solid #eee}.resource strong{font-weight:650}.agentActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.agentActions button{border:1px solid #c8c9c5;background:#fff;border-radius:6px;padding:7px 8px;font-size:9px}.agentActions button.primary{background:#222;color:#fff}
.calendarSplit{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:685px}.mobile .calendarSplit{display:block}.calendarRail{border-left:1px solid #ddd;background:#fafaf9;padding:18px;font-family:Inter,sans-serif}.mobile .calendarRail{border-left:0;border-top:1px solid #ddd}.calendarRail h2{font-size:14px;margin:0 0 13px}.timeRow{display:grid;grid-template-columns:42px 1fr;gap:8px;min-height:55px;border-top:1px solid #eee;padding-top:5px}.timeRow .time{font-size:9px;color:#999}.event{border-left:3px solid #7e9ec7;background:#edf3fa;border-radius:5px;padding:6px 8px;font-size:10px}.event.family{border-left-color:#d4967d;background:#fff1ea}.event.opportunity{border-left-color:#999;background:#f2f2f0;color:#777}.deletedList{font-family:Inter,sans-serif;max-width:760px;margin:0 auto;padding:20px 30px}.deletedHeader{display:flex;align-items:center;gap:8px;margin-bottom:12px}.deletedHeader h1{font-size:19px;margin:0 auto 0 0}.deletedRow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:9px;align-items:center;padding:10px 5px;border-bottom:1px solid #eee;font-size:11px}.deletedRow .check{width:14px;height:14px;border:1px solid #777;border-radius:2px}.deletedRow .meta{color:#999;font-size:9px;margin-top:2px}.deletedRow button{border:1px solid #ccc;background:#fff;border-radius:5px;padding:5px 7px;font-size:9px}
.raw{display:grid;grid-template-columns:1.15fr .85fr;gap:12px;padding:20px;font-family:Inter,sans-serif}.mobile .raw{grid-template-columns:1fr}.rawCode{background:#202124;color:#e7e8ea;border-radius:8px;padding:15px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;white-space:pre-wrap;min-height:520px}.repair{border:1px solid #d0d0cb;border-radius:8px;padding:14px;background:#fafafa}.repair h2{font-size:14px;margin:0 0 6px}.repair p{font-size:10px;color:#666}.repairOpt{border:1px solid #ddd;background:#fff;border-radius:7px;padding:9px;margin:7px 0;font-size:10px}.repairOpt strong{display:block;margin-bottom:2px}
@media(max-width:1120px){.layout{grid-template-columns:190px minmax(0,1fr)}.reviewPanel{display:none}}
@media(max-width:780px){.layout{display:block;padding:8px}.frameNav{position:static;max-height:none;display:flex;overflow:auto;gap:4px;padding:7px;margin-bottom:8px}.frameNav h2,.frameNav .group{display:none}.frameNav button{min-width:160px}.topbar{height:auto;min-height:55px;padding:7px}.brand small{display:none}.stageMeta{padding:0 4px}.stage{border-radius:9px}.mockApp{min-height:780px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">Task system storyboard v2<small>Text first · bulk first · hierarchy without noise</small></div>
    <button class="nav" id="prev">←</button>
    <select id="frameSelect"></select>
    <button class="nav" id="next">→</button>
    <button data-view="desktop" class="active">Desktop</button>
    <button data-view="mobile">Mobile</button>
  </header>
  <main class="layout">
    <nav class="frameNav" id="frameNav"><h2>Frames</h2></nav>
    <section class="stageWrap">
      <div class="stageMeta"><span id="stageLabel"></span><span id="modeLabel"></span></div>
      <div id="stage" class="stage"><div id="canvas"></div></div>
    </section>
    <aside class="reviewPanel">
      <div class="eyebrow" id="panelMode"></div>
      <h1 id="panelTitle"></h1>
      <h3>User action</h3><p id="panelAction"></p>
      <h3>Semantic result</h3><div class="semantic" id="panelEffect"></div>
      <h3>Evaluate</h3><ul id="panelWatch"></ul>
      <h3>Decision</h3>
      <div class="rating"><button data-rating="good">Promising</button><button data-rating="maybe">Unclear</button><button data-rating="bad">Wrong</button></div>
      <h3>Notes</h3><textarea id="notes" placeholder="What feels natural or wrong?"></textarea>
      <button class="export" id="export">Export review JSON</button>
    </aside>
  </main>
</div>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const tasks=[
'Finish investor update deck — send by 10am','Outline the retention argument — 20 min','Review Q2 KPIs with team','Prepare talking points for leadership','1:1 with Sharon','Update roadmap','Draft PRD for onboarding flow','Sync with design team','Call pediatrician','Renew passport','Book dentist cleaning','Submit expense report','Pick up dry cleaning','Check radon levels','Find washer warranty email','Pay daycare invoice','Message Alex about Tuesday coverage','Review pull request','Prepare promotion packet data','Send birthday RSVP','Triage inbox','Plan team offsite','Read design feedback','Fix lamp','Review insurance options','Confirm architect measurements','Draft contractor questions','Review AI events this week','Choose library story time','Research renovation zoning constraints'];
function side(){return `<aside class="side"><div class="traffic"><i></i><i></i><i></i></div><div class="sideItem active">▣ &nbsp; Daily notes</div><div class="sideItem">□ &nbsp; Projects</div><div class="sideItem">⌑ &nbsp; Inbox</div><div class="sideItem">⌕ &nbsp; Search</div><div class="sideSep">Recent</div><div class="sideItem active">Wed, Aug 19</div><div class="sideItem">Tue, Aug 18</div><div class="sideItem">Mon, Aug 17</div><div class="sideItem">Sun, Aug 16</div><div class="sideSep">Saved views</div><div class="sideItem">Review candidates</div><div class="sideItem">Waiting</div><div class="sideItem">Agent work</div></aside>`}
function appTop(extra=''){return `<div class="appTop"><div>‹ &nbsp; ›</div><div class="tools"><span>Edited just now</span>${extra}<button>#</button><button>☷</button><button>•••</button></div></div>`}
function line(label,{done=false,urgent=false,trail='',tag='',cls='',meta=''}={}){return `<div class="line ${done?'done':''} ${urgent?'urgent':''} ${cls}"><span class="box"></span><span>${label}</span>${trail?`<span class="trail">› ${trail}</span>`:''}${tag?`<span class="tag">${tag}</span>`:''}${meta?`<span class="metaInline">${meta}</span>`:''}</div>`}
function noteShell(body,{extraTop='',after='',title='Wednesday, August 19'}={}){return `<div class="mockApp">${side()}<section class="main">${appTop(extraTop)}<article class="note"><h1>${title}</h1>${body}</article>${after}</section></div>`}
function baseNote({review=false,selected=false,includeAll=false}={}){
 let work=[
 line('Outline the retention argument — 20 min',{trail:'Promotion rec.',cls:selected?'selected':review?'reviewHigh':''}),
 `<div class="nested"><div>- Pull last quarter’s impact numbers.</div><div>- Compare with industry benchmarks.</div><div>- Draft the core argument in 5 bullets.</div></div>`,
 line('Finish investor update deck — send by 10am',{urgent:true,tag:'#urgent',cls:review?'reviewHigh':''}),
 line('Review Q2 KPIs with team',{cls:review?'reviewMed':''}),
 line('Prep roadmap sync — async updates',{cls:review?'reviewMed':''}),
 line('Follow up with Jamie on analytics schema',{cls:review?'reviewLow':''}),
 line('Unblock data export for finance',{cls:review?'reviewMed':''})
 ].join('');
 let admin=[line('Call pediatrician',{tag:'#task',cls:review?'reviewHigh':''}),line('Renew passport',{cls:review?'reviewLow':''}),line('Book dentist cleaning',{cls:review?'reviewLow':''}),line('Submit expense report',{cls:review?'reviewMed':''}),line('Pick up dry cleaning',{cls:review?'reviewLow':''})].join('');

{group:'Task / step',title:'8 · Rewrite a pulled-in task',mode:'Decision comparison',action:'Change “Draft promotion recommendation” to “Outline the retention argument — 20 min.”',effect:'This frame compares the only three semantics that still matter. The global A/B/C switch has been removed.',watch:['Does explicit conversion add acceptable friction?','Can smart conversion be safe and reversible enough?','Is strict rename clearly the wrong default?'],render:()=>noteShell(`<div class="compare"><div class="compareCard"><div class="badge">Control · likely reject</div><h3>Strict rename</h3><div class="example">- [ ] Outline the retention argument — 20 min<br><br><span class="muted">Durable task renamed everywhere.</span></div><div class="result">Simple mechanically, but destroys the user’s freedom to reframe today’s work.</div></div><div class="compareCard"><div class="badge">Explicit</div><h3>Create linked step</h3><div class="example">- [ ] Outline the retention argument — 20 min <span class="trail">› Promotion rec.</span><br><br><span class="muted">Command: “Convert to step”</span></div><div class="result">Clear semantics, but introduces a deliberate command.</div></div><div class="compareCard leading"><div class="badge">Leading hypothesis</div><h3>Smart rewrite to step</h3><div class="example">- [ ] Outline the retention argument — 20 min <span class="trail">› Promotion rec.</span><div class="toast">Created linked step <button>Rename task instead</button></div></div><div class="result">Preserves flow; the toast makes the inference reversible.</div></div></div>`)},

{group:'Task workspace',title:'11 · Parent-first task sidebar',mode:'Task workspace',action:'Open the parent task from the breadcrumb or command palette.',effect:'The parent task opens in a right sidebar. Its hierarchy is primary; the selected step is highlighted inside Steps rather than surrounded by a “This context” shell.',watch:['Does parent-first orientation remove the earlier confusion?','Are Overview, Steps, Notes, Activity, Sources the right information architecture?','Should the note remain editable while the sidebar is open?'],render:()=>`<div class="mockApp">${side()}<section class="main">${appTop()}<div class="split"><article class="note"><h1>Wednesday, August 19</h1><h2>Work</h2>${line('Outline the retention argument — 20 min',{trail:'Promotion rec.',cls:'selected'})}<div class="nested"><div>- Pull last quarter’s impact numbers.</div></div>${line('Review Q2 KPIs with team')}</article><aside class="taskSide"><span class="taskId">TASK T-173</span><h1>Draft promotion recommendation</h1><div class="tabs"><button class="active">Overview</button><button>Steps</button><button>Notes</button><button>Activity</button><button>Sources</button></div><div class="summaryGrid"><div class="summaryCell"><label>Status</label><strong>In progress</strong></div><div class="summaryCell"><label>Due</label><strong>Friday</strong></div><div class="summaryCell"><label>Owner</label><strong>You</strong></div><div class="summaryCell"><label>Priority</label><strong>High</strong></div></div><div class="sideSection"><h3>Current steps</h3><div class="stepRow current"><strong>Outline the retention argument — 20 min</strong><small>Wednesday note · selected</small></div><div class="stepRow"><strong>Gather retention impact numbers</strong><small>Created Monday</small></div><div class="stepRow done"><strong>Review compensation benchmarks</strong><small>Completed yesterday</small></div></div><div class="sideSection"><h3>Next decision</h3><div class="stepRow">Decide whether to wait for Q4 results before drafting the final packet.</div></div></aside></div></section></div>`},

{group:'Execution',title:'15 · Agent block with evidence and budget',mode:'Execution · Agent',action:'Inspect a blocked research run before choosing local wait, cloud spend, or plan revision.',effect:'Resource decisions include progress, recent chat, the current plan, wait time, cost estimate, and budget—rather than blind top-level buttons.',watch:['Is the information sufficient to trust a spend decision?','Which progress details matter versus create noise?','Should the AI make a recommendation with a confidence explanation?'],render:()=>noteShell(`<h2>Agent work</h2>${line('Research renovation zoning constraints',{cls:'agent',meta:'blocked'})}<div class="agentGrid"><div class="agentPanel"><h3>Progress · 72%</h3><div class="progress"><i></i></div><div class="chatLine"><strong>Planning Researcher</strong><br>Collected 45 of 60 relevant sources and extracted the main height and setback rules.</div><div class="chatLine"><strong>Current plan</strong><br>Finish source extraction, compare exceptions, then draft a cited zoning memo.</div><div class="chatLine"><strong>Blocked</strong><br>Local GPU queue is occupied by another run.</div></div><div class="agentPanel"><h3>Resource choices</h3><div class="resource"><span>Resume locally</span><strong>~18 min wait</strong></div><div class="resource"><span>Cloud completion</span><strong>~7 min · $0.06</strong></div><div class="resource"><span>Task budget available</span><strong>$4.20</strong></div><div class="agentActions"><button>Review chat</button><button>Revise plan</button><button>Pause</button><button class="primary">Run in cloud · max $0.50</button></div></div></div>`)},
{group:'Execution',title:'16 · Calendar as a side-by-side composer',mode:'Day composer',action:'Toggle the schedule rail after selecting the day’s working set.',effect:'Calendar, routines, family obligations, and optional opportunities appear beside the note—not as pseudo-task lines inside it.',watch:['Does side-by-side planning preserve the note’s primacy?','How should dragging a step into time create a block without moving the text?','When does the rail become too narrow or distracting?'],render:()=>`<div class="mockApp">${side()}<section class="main">${appTop('<button>Day composer</button>')}<div class="calendarSplit"><article class="note"><h1>Wednesday, August 19</h1><h2>Top priorities</h2>${line('Finish investor update deck — send by 10am',{urgent:true})}${line('Outline the retention argument — 20 min',{trail:'Promotion rec.'})}${line('Call pediatrician')}<h2>Work</h2>${line('Review Q2 KPIs with team')}${line('Prep roadmap sync')}<p>Protect a deep-work block before lunch.</p><h2 class="collapsed">▸ Family <span>4 items hidden</span></h2></article><aside class="calendarRail"><h2>Schedule · Wed 19</h2><div class="timeRow"><div class="time">9:00</div><div class="event">Investor update deck</div></div><div class="timeRow"><div class="time">10:00</div><div class="event">Outline retention argument</div></div><div class="timeRow"><div class="time">11:00</div><div class="event opportunity">Optional · AI founders breakfast</div></div><div class="timeRow"><div class="time">12:00</div><div class="event family">Lunch / help before nap</div></div><div class="timeRow"><div class="time">1:30</div><div class="event">1:1 with Sharon</div></div></aside></div></section></div>`)},
{group:'Recovery',title:'17 · Recently deleted with bulk recovery',mode:'Recovery',action:'Open Recently Deleted, shift-select several items, and restore or purge in bulk.',effect:'Task deletion, source-note deletion, and removal from Today remain distinct. Recovery uses familiar list-selection patterns.',watch:['Are the object types and consequences clear enough?','Should permanent delete require typed confirmation only for high-impact selections?','Can users filter by actor or agent?'],render:()=>`<div class="mockApp">${side()}<section class="main">${appTop()}<div class="deletedList"><div class="deletedHeader"><h1>Recently Deleted</h1><button>Filter</button><button>Sort</button></div><div class="deletedRow selected"><span class="check"></span><div><strong>1:1 with Sharon — Aug 16</strong><div class="meta">Source note · 3 linked tasks survive · deleted today</div></div><button>Restore</button></div><div class="deletedRow selected"><span class="check"></span><div><strong>Fix lamp</strong><div class="meta">Task · deleted by Agent Clerk · yesterday</div></div><button>Restore</button></div><div class="deletedRow selected"><span class="check"></span><div><strong>Old renovation research draft</strong><div class="meta">Document · no unique task links</div></div><button>Restore</button></div><div class="deletedRow"><span class="check"></span><div><strong>Vendor shortlist v1</strong><div class="meta">Document · deleted Aug 17</div></div><button>Restore</button></div><div class="bulkBar"><strong>3 items selected</strong><button class="primary">Restore selected</button><button>Delete permanently</button></div></div></section></div>`)},

{group:'Mobile',title:'19 · Mobile writing and selection',mode:'Mobile',forceMobile:true,action:'Write normally, use the accessory rail, or enter selection mode for bulk operations.',effect:'Mobile avoids hover dependence. Inline controls remain optional; a thin rail and bottom selection bar provide the core operations.',watch:['Does the note remain readable at 390px?','Are the toolbar targets large enough without consuming the screen?','How should multi-select begin—long press, gutter tap, or command?'],render:()=>noteShell(`<h2>Top priorities</h2>${line('Finish investor update deck — send by 10am',{urgent:true})}${line('Outline the retention argument — 20 min',{trail:'Promotion rec.'})}<h2>Work</h2>${line('Review Q2 KPIs with team')}${line('Prep roadmap sync')}${line('Call pediatrician',{tag:'#task'})}<h2 class="collapsed">▸ Family <span>4 hidden</span></h2><p>Need to keep enough time before lunch and nap.</p>`,{after:mobileAccessory()})}
];
let current=0, view='desktop';
const params=new URLSearchParams(location.search); if(params.has('frame')) current=Math.max(0,Math.min(frames.length-1,Number(params.get('frame'))-1)); if(params.get('view')==='mobile') view='mobile';
let reviews={}; try{reviews=JSON.parse(localStorage.getItem('taskStoryboardV2Reviews')||'{}')}catch(e){}
function persist(){localStorage.setItem('taskStoryboardV2Reviews',JSON.stringify(reviews))}
function render(){
 const f=frames[current]; const mobile=f.forceMobile||view==='mobile';
 document.getElementById('stage').classList.toggle('mobile',mobile);
 document.getElementById('canvas').innerHTML=f.render();
 document.getElementById('stageLabel').textContent=`Frame ${current+1} of ${frames.length}`;
 document.getElementById('modeLabel').textContent=f.mode;
 document.getElementById('panelMode').textContent=f.mode;
 document.getElementById('panelTitle').textContent=f.title;
 document.getElementById('panelAction').textContent=f.action;
 document.getElementById('panelEffect').textContent=f.effect;
 document.getElementById('panelWatch').innerHTML=f.watch.map(x=>`<li>${esc(x)}</li>`).join('');
 document.getElementById('frameSelect').value=current;
 document.querySelectorAll('#frameNav button').forEach((b,i)=>b.classList.toggle('active',i===current));
 document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===(mobile?'mobile':'desktop')));
 document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===frames.length-1;
 const r=reviews[current]||{}; document.querySelectorAll('[data-rating]').forEach(b=>b.classList.toggle('active',b.dataset.rating===r.rating)); document.getElementById('notes').value=r.notes||'';
}
function go(n){current=Math.max(0,Math.min(frames.length-1,n));render();}
const select=document.getElementById('frameSelect');
let lastGroup=''; frames.forEach((f,i)=>{if(f.group!==lastGroup){const g=document.createElement('div');g.className='group';g.textContent=f.group;document.getElementById('frameNav').appendChild(g);lastGroup=f.group}const o=document.createElement('option');o.value=i;o.textContent=f.title;select.appendChild(o);const b=document.createElement('button');b.textContent=f.title;b.onclick=()=>go(i);document.getElementById('frameNav').appendChild(b)});
select.onchange=e=>go(Number(e.target.value));document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
document.querySelectorAll('[data-rating]').forEach(b=>b.onclick=()=>{reviews[current]={...(reviews[current]||{}),rating:b.dataset.rating,notes:document.getElementById('notes').value};persist();render()});
document.getElementById('notes').oninput=e=>{reviews[current]={...(reviews[current]||{}),notes:e.target.value};persist()};
document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),reviews},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='task-system-storyboard-v2-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
render();
</script>
