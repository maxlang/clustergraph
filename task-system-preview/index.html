<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Task System Storyboard</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f5f2;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#333}
  #loading{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;z-index:2;background:#f5f5f2}
  .dot{width:8px;height:8px;border-radius:50%;background:#333;display:inline-block;animation:p 1s infinite alternate}
  @keyframes p{to{opacity:.25}}
  #storyboard{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;background:#f0f0ed;display:none}
  #error{display:none;position:fixed;inset:0;overflow:auto;padding:24px;background:#f5f5f2}
  pre{white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div id="loading"><div><span class="dot"></span><p>Loading task-system prototype…</p></div></div>
<div id="error"><h1>Couldn’t load prototype</h1><p>This diagnostic is safe to send back.</p><pre id="errorText"></pre></div>
<script>
(async()=>{
  try{
    const base='https://cdn.jsdelivr.net/gh/maxlang/clustergraph@d5f935e738d10611380e46c96e2a03fd11d35089/task-system-preview/';
    const files=['chunk-001.txt','chunk-002.txt','chunk-003.txt','chunk-004.txt','chunk-005.txt','chunk-006a.txt','chunk-006b.txt','chunk-007.txt'];
    const parts=[];
    for(const file of files){
      const response=await fetch(base+file,{cache:'no-store'});
      if(!response.ok) throw new Error(file+': HTTP '+response.status);
      parts.push(await response.text());
    }
    const html=parts.join('');
    if(!html.includes('id="canvas"') || !html.includes('const frames=')) throw new Error('Downloaded storyboard is incomplete.');
    const frame=document.createElement('iframe');
    frame.id='storyboard';
    frame.title='Task system interaction storyboard';
    frame.allow='clipboard-read; clipboard-write';
    frame.onload=()=>{
      document.getElementById('loading').style.display='none';
      frame.style.display='block';
    };
    document.body.appendChild(frame);
    if('srcdoc' in frame){
      frame.srcdoc=html;
    }else{
      frame.src=URL.createObjectURL(new Blob([html],{type:'text/html'}));
    }
    setTimeout(()=>{
      if(frame.style.display!=='block') throw new Error('Storyboard frame did not finish loading.');
    },12000);
  }catch(error){
    document.getElementById('loading').style.display='none';
    document.getElementById('error').style.display='block';
    document.getElementById('errorText').textContent=String(error&&error.stack||error);
  }
})().catch(error=>{
  document.getElementById('loading').style.display='none';
  document.getElementById('error').style.display='block';
  document.getElementById('errorText').textContent=String(error&&error.stack||error);
});
</script>
</body>
</html>
