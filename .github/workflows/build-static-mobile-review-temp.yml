name: Build static mobile storyboard review

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/build-static-mobile-review-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-system-preview-20260823
          fetch-depth: 0
      - name: Build static no-JavaScript review page
        run: |
          python task-system-preview/build-static.py
          test -s task-system-preview/mobile-review.html
          grep -q 'Static mobile review' task-system-preview/mobile-review.html
          grep -q 'id="frame-19"' task-system-preview/mobile-review.html
          if grep -q '<script' task-system-preview/mobile-review.html; then
            echo 'Unexpected script tag in static page'
            exit 1
          fi
      - name: Commit result to preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add task-system-preview/mobile-review.html
          if git diff --cached --quiet; then
            echo "mobile-review.html already current"
            exit 0
          fi
          git commit -m "Build static mobile storyboard review [skip ci]"
          git push origin HEAD:task-system-preview-20260823
