name: Deploy task-system preview to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/deploy-task-system-preview-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out self-contained preview
        uses: actions/checkout@v4
        with:
          ref: task-system-preview-20260823

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp task-system-preview/storyboard.html _site/index.html
          touch _site/.nojekyll
          test -s _site/index.html
          grep -q 'id="canvas"' _site/index.html
          grep -q 'const frames=' _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
